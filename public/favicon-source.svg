<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7e30e1"/>
      <stop offset="100%" style="stop-color:#49108b"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGradient)"/>
  <!-- Letter P -->
  <text 
    x="50%" 
    y="55%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="Arial Black, sans-serif" 
    font-size="340" 
    font-weight="900" 
    fill="#ffffff"
  >P</text>
  <!-- Accent dot matching your theme -->
  <circle cx="380" cy="380" r="40" fill="#e26ee5"/>
</svg>
